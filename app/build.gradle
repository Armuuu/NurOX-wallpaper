plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nurox.wallpapers'
    compileSdk 34

    defaultConfig {
        applicationId "com.nurox.wallpapers"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
